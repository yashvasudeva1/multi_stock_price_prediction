name: CD — Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    # Only deploy after CI passes
    needs: []

    steps:
      - name: Trigger Render deploy hook
        # Set RENDER_DEPLOY_HOOK_URL in GitHub repository secrets.
        # Get the URL from Render → Service → Settings → Deploy Hook.
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json"

      - name: Note — Render auto-deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "RENDER_DEPLOY_HOOK_URL secret not set."
          echo "Render's automatic Git deployment will deploy on push to main."
          echo "To use an explicit hook: Settings → Deploy Hook in your Render dashboard."

      - name: Wait for deployment to start
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: sleep 30

      - name: Smoke test /health on production
        # Set RENDER_APP_URL in GitHub repository secrets, e.g. https://my-app.onrender.com
        if: ${{ secrets.RENDER_APP_URL != '' }}
        run: |
          for i in 1 2 3 4 5; do
            response=$(curl -fsS "${{ secrets.RENDER_APP_URL }}/health" 2>/dev/null) && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "$response" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data.get('status') == 'ok', f'Health check failed: {data}'
          print('✓ Production /health OK:', data)
          "
